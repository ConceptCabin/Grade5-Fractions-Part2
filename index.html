            "5/16",
            "5/8",
            "1/8",
            "6/8"

        "a": 1,
        "wp": false,
        "exp": "Add numerators for like fractions: (3+2)/8 = 5/8."
    },
    {

            "11/9",

    {

            "2/5",
            "5/6",
            "1/6",
            "3/6"
        ],

        "wp": false,

    },
    {

            "2 3/4 m",

            "7/12",
            "5/12",
            "1/2"

        "a": 1,
        "wp": false,
        "exp": "LCD is 12. 3/4 = 9/12 and 1/6 = 2/12. 9/12 - 2/12 = 7/12."
    },
    {
        "q": "Evaluate: 2 1/3 + 1 1/6",

            "3 2/9",
            "3 1/3",

        "a": 0,

        "exp": "Add whole numbers (2+1=3) and fractions (1/3 = 2/6). 2/6 + 1/6 = 3/6 = 1/2. Total = 3 1/2."
    },
    {
        "q": "Evaluate: 4 - 3/5",

            "3 2/5",
            "2 3/5",
            "4 2/5",
            "3 3/5"
        ],
        "a": 0,
        "wp": false,
        "exp": "Borrow 1 from 4 (making it 3) and write as 5/5. 5/5 - 3/5 = 2/5. Total = 3 2/5."
    },
    {

        "wp": true,
        "exp": "4 1/2 = 4 2/4 = 3 6/4. Subtract 1 3/4: (3 - 1) + (6/4 - 3/4) = 2 3/4 liters."
    },

            "2/3",

    },
    {
        "q": "Tina spends 1/3 of her day sleeping, 1/4 of her day at school, and the rest playing or studying. What fraction of her day is spent sleeping and at school combined?",
        "o": [
            "7/12",
            "5/12",
            "1/2",
            "3/4"
        ],
        "a": 0,
        "wp": true,
        "exp": "1/3 + 1/4 = 4/12 + 3/12 = 7/12."
    },
    {
        "q": "Evaluate: 5/9 + 2/9 + 1/9",
        "o": [
            "7/9",
            "8/9",
            "1",
            "6/9"
        ],
        "a": 1,
        "wp": false,
        "exp": "(5+2+1)/9 = 8/9."
    },
    {
        "q": "Subtract: 5 - 2 3/4",
        "o": [
            "3 1/4",
            "2 1/4",
            "2 3/4",
            "3 3/4"
        ],
        "a": 1,
        "wp": false,
        "exp": "4 4/4 - 2 3/4 = 2 1/4."
    }
];

    let currentQuestion = 0;
    let userAnswers = new Array(questions.length).fill(null); 
    let questionStates = new Array(questions.length).fill("unanswered");
    let score = 0;
    let selectedOptionTemp = null;

    const coverPage = document.getElementById("cover-page");
    const quizView = document.getElementById("quiz-view");
    const scoreCard = document.getElementById("score-card");
    const questionCountElem = document.getElementById("question-count");
    const scoreTrackerElem = document.getElementById("score-tracker");
    const progressBarElem = document.getElementById("progress-bar");
    const badgeContainerElem = document.getElementById("badge-container");
    const questionTextElem = document.getElementById("question-text");
    const optionsContainerElem = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const nextBtnElem = document.getElementById("next-btn");
    const skipBtnElem = document.getElementById("skip-btn");
    const paletteGrid = document.getElementById("palette-grid");
    const paletteProgressText = document.getElementById("palette-progress-text");
    const finalScoreElem = document.getElementById("final-score");
    const reviewList = document.getElementById("review-list");

    function startQuiz() {
        coverPage.style.display = "none";
        quizView.style.display = "block";
        buildPalette();
        loadQuestion();
    }

    function buildPalette() {
        paletteGrid.innerHTML = "";
        questions.forEach((_, idx) => {
            const item = document.createElement("div");
            item.className = "palette-item";
            item.textContent = idx + 1;
            item.onclick = () => {
                currentQuestion = idx;
                selectedOptionTemp = userAnswers[idx];
                loadQuestion();
            };
            paletteGrid.appendChild(item);
        });
        updatePaletteUI();
    }

    function updatePaletteUI() {
        const items = paletteGrid.children;
        let answeredCount = 0;
        for (let i = 0; i < items.length; i++) {
            items[i].className = "palette-item";
            if (i === currentQuestion) {
                items[i].classList.add("current");
            } 
            if (questionStates[i] === "answered") {
                items[i].classList.add("answered");
                answeredCount++;
            } else if (questionStates[i] === "skipped") {
                items[i].classList.add("skipped");
            }
        }
        paletteProgressText.textContent = `${answeredCount}/25 Answered`;
    }

    function loadQuestion() {
        const qData = questions[currentQuestion];
        const savedAnswer = userAnswers[currentQuestion];
        const isLocked = questionStates[currentQuestion] === "answered";

        questionCountElem.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        scoreTrackerElem.textContent = `Score: ${score}`;
        progressBarElem.style.width = `${((questionStates.filter(s => s === "answered").length) / questions.length) * 100}%`;

        if (qData.wp) {
            badgeContainerElem.innerHTML = `<span class="badge">Word Problem</span>`;
        } else {
            badgeContainerElem.innerHTML = `<span class="badge" style="background:#e0e7ff; color:#4f46e5;">Concept & Computation</span>`;
        }

        questionTextElem.textContent = `${currentQuestion + 1}. ${qData.q}`;
        optionsContainerElem.innerHTML = "";
        explanationBox.style.display = "none";

        selectedOptionTemp = savedAnswer;

        qData.o.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = option;

            if (isLocked) {
                btn.disabled = true;
                if (index === qData.a) {
                    btn.classList.add("correct");
                } else if (index === savedAnswer) {
                    btn.classList.add("incorrect");
                }
            } else {
                if (index === selectedOptionTemp) {
                    btn.style.borderColor = "var(--primary)";
                    btn.style.background = "#fff1f2";
                }
                btn.onclick = () => selectOption(index, btn);
            }

            optionsContainerElem.appendChild(btn);
        });

        if (isLocked) {
            explanationBox.textContent = `Explanation: ${qData.exp}`;
            explanationBox.style.display = "block";
            nextBtnElem.textContent = "Go to Next";
            nextBtnElem.disabled = false;
            skipBtnElem.style.display = "none";
        } else {
            nextBtnElem.textContent = "Lock & Submit";
            nextBtnElem.disabled = selectedOptionTemp === null;
            skipBtnElem.style.display = "block";
        }

        updatePaletteUI();
    }

    function selectOption(index, btn) {
        selectedOptionTemp = index;
        const buttons = optionsContainerElem.getElementsByClassName("option-btn");
        for (let b of buttons) {
            b.style.borderColor = "var(--border)";
            b.style.background = "#ffffff";
        }
        btn.style.borderColor = "var(--primary)";
        btn.style.background = "#fff1f2";
        nextBtnElem.disabled = false;
    }

    nextBtnElem.onclick = function() {
        const isLocked = questionStates[currentQuestion] === "answered";
        
        if (!isLocked) {
            const qData = questions[currentQuestion];
            const buttons = optionsContainerElem.getElementsByClassName("option-btn");
            
            userAnswers[currentQuestion] = selectedOptionTemp;
            questionStates[currentQuestion] = "answered";

            if (selectedOptionTemp === qData.a) {
                buttons[selectedOptionTemp].classList.add("correct");
                score++;
            } else {
                buttons[selectedOptionTemp].classList.add("incorrect");
                buttons[qData.a].classList.add("correct");
            }

            for (let b of buttons) b.disabled = true;

            explanationBox.textContent = `Explanation: ${qData.exp}`;
            explanationBox.style.display = "block";
            scoreTrackerElem.textContent = `Score: ${score}`;
            nextBtnElem.textContent = "Go to Next";
            skipBtnElem.style.display = "none";
            updatePaletteUI();

        } else {
            moveToNextUnansweredOrAdvance();
        }
    };

    function skipQuestion() {
        if (questionStates[currentQuestion] === "unanswered") {
            questionStates[currentQuestion] = "skipped";
        }
        moveToNextUnansweredOrAdvance();
    }

    function moveToNextUnansweredOrAdvance() {
        let nextIdx = (currentQuestion + 1) % questions.length;
        let checked = 0;
        while (questionStates[nextIdx] === "answered" && checked < questions.length) {
            nextIdx = (nextIdx + 1) % questions.length;
            checked++;
        }

        if (checked === questions.length) {
            showScore();
        } else {
            currentQuestion = nextIdx;
            selectedOptionTemp = userAnswers[currentQuestion];
            loadQuestion();
        }
    }

    function showScore() {
        quizView.style.display = "none";
        scoreCard.style.display = "block";
        finalScoreElem.textContent = `Your Score: ${score} / ${questions.length}`;

        reviewList.innerHTML = "";
        let incorrectCount = 0;

        questions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            if (userAns !== q.a) {
                incorrectCount++;
                const div = document.createElement("div");
                div.className = "review-item";
                div.innerHTML = `<strong>Q${idx + 1}:</strong> ${q.q}<br>
                    <span style="color:var(--error)">Your Answer: ${userAns !== null ? q.o[userAns] : "Skipped"}</span><br>
                    <span style="color:var(--success)">Correct Answer: ${q.o[q.a]}</span><br>
                    <em style="color:#475569; font-size:0.85rem;">${q.exp}</em>`;
                reviewList.appendChild(div);
            }
        });

        if (incorrectCount === 0) {
            reviewList.innerHTML = "<p style='color:var(--success); font-weight:600;'>Amazing! You got every single question correct in Part 2!</p>";
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        userAnswers = new Array(questions.length).fill(null);
        questionStates = new Array(questions.length).fill("unanswered");
        scoreCard.style.display = "none";
        coverPage.style.display = "block";
    }
</script>

</body>
</html>
